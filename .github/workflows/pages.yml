name: Deploy IEUM to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ieum-v2-download/**
      - scripts/build-pages.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare archived application for Pages
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          PAGES_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}/
        run: node scripts/build-pages.mjs "$PAGES_BASE/" "$PAGES_URL"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
